spring:
  application:
    name: currency-fallback-service

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

external:
  rates:
    base-url: https://open.er-api.com
    latest-path: /v6/latest/
    base-currency: USD

currency:
  rates:
    refresh-interval: 3600000
    refresh-initial-delay: 0

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  user:
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}